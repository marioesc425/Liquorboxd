<h1>Spirits</h1>

<form method="get">
    <input type="text" name="q" placeholder="Search spirits...">
    <button type="submit">Search</button>
</form>

<ul>
{% for spirit in spirits %}
    <li>
        <a href="{% url 'spirit_detail' spirit.pk %}">{{ spirit.name }}</a>
        — {{ spirit.brand }} ({{ spirit.category }})
    </li>
{% endfor %}
</ul>
